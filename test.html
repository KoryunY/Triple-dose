<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Triple Dose – Lobby Test</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; padding: 16px; font: 15px/1.5 system-ui, sans-serif; background: #0b0d12; color: #e8ecf4; }
      main { max-width: 480px; margin: 0 auto; }
      h1 { font-size: 20px; }
      section { background: #151923; border-radius: 12px; padding: 14px; margin: 12px 0; }
      input, button { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid #2a3142; background: #0f131b; color: inherit; }
      button { background: #4f8cff; border: 0; color: #fff; cursor: pointer; }
      button.secondary { background: #2a3142; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
      .row input { flex: 1; min-width: 0; }
      .muted { color: #8a93a6; font-size: 13px; }
      .seat { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #222838; }
      .err { color: #ff7b7b; }
      code { font-size: 18px; letter-spacing: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Lobby test</h1>
      <p class="muted">Guest accounts and 3-player rooms, saved in the database. Reload to test rejoin.</p>

      <section id="guestBox">
        <div id="guestInfo" class="muted">Not joined yet</div>
        <div class="row">
          <input id="name" placeholder="Name (optional)" maxlength="24" />
          <button id="joinGuest">Join as guest</button>
        </div>
      </section>

      <section id="roomBox" hidden>
        <div class="row">
          <button id="create">Create room</button>
          <input id="code" placeholder="Room code" maxlength="6" />
          <button id="join" class="secondary">Join</button>
        </div>
        <div id="roomInfo"></div>
      </section>

      <p id="msg" class="err"></p>
      <p class="muted"><a href="/" style="color:#8fb3ff">← Back to cube</a> · <button id="reset" class="secondary">Forget this guest</button></p>
    </main>
    <script type="module" src="/src/lobby.js"></script>
  </body>
</html>
